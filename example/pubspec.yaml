name: example
description: Демо-приложение для пакета editor (LSP, tree-sitter, темы).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cupertino_icons: ^1.0.8
  editor:
    path: ../
  ffi: ^2.2.0
